
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Lost & Found</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- Admin Navbar -->

    <header class="admin-navbar">

        <div class="admin-nav-container">

            <a href="admin-dashboard.html" class="admin-brand">

                <div class="admin-brand-icon">
                    <i class="bi bi-geo-alt"></i>
                </div>

                <div class="admin-brand-text">
                    <span class="admin-brand-name">Lost &amp; Found</span>
                    <span class="admin-brand-tagline">Helping you find what matters</span>
                </div>

            </a>

            <nav class="admin-nav-links">

                <a href="admin-dashboard.html" class="active">Dashboard</a>
                <a href="admin-lost-items.html">Lost</a>
                <a href="admin-found-items.html">Found</a>
                <a href="admin-users.html">Users</a>

            </nav>

            <button type="button" class="admin-login-btn" id="adminLogoutBtn">
                Logout
                <i class="bi bi-box-arrow-right"></i>
            </button>

        </div>

    </header>

    <!-- Dashboard -->

    <main class="admin-dashboard">

        <section class="dashboard-header">

            <span class="dashboard-label">
                <i class="bi bi-grid-1x2-fill"></i>
                ADMIN DASHBOARD
            </span>

            <h1>Dashboard</h1>

            <p>Overview of the Lost &amp; Found portal.</p>

        </section>

        <!-- Statistics -->

        <section class="dashboard-stats">

            <div class="dashboard-stat-card">

                <div class="stat-icon purple">
                    <i class="bi bi-box-seam"></i>
                </div>

                <div class="stat-content">
                    <span>Total Items</span>
                    <strong>24</strong>
                    <small>All reported items</small>
                </div>

            </div>

            <div class="dashboard-stat-card">

                <div class="stat-icon red">
                    <i class="bi bi-search"></i>
                </div>

                <div class="stat-content">
                    <span>Lost Items</span>
                    <strong>14</strong>
                    <small>Items reported lost</small>
                </div>

            </div>

            <div class="dashboard-stat-card">

                <div class="stat-icon green">
                    <i class="bi bi-check-circle"></i>
                </div>

                <div class="stat-content">
                    <span>Found Items</span>
                    <strong>10</strong>
                    <small>Items found</small>
                </div>

            </div>

            <div class="dashboard-stat-card">

                <div class="stat-icon pink">
                    <i class="bi bi-heart"></i>
                </div>

                <div class="stat-content">
                    <span>Total Claims</span>
                    <strong>8</strong>
                    <small>Claim requests</small>
                </div>

            </div>

        </section>

    </main>

    <!-- Logout -->

  <!-- Logout -->
<script>
    document.getElementById("adminLogoutBtn").addEventListener("click", function() {

        sessionStorage.removeItem("adminLoggedIn");

        window.location.href = "../index.html";

    });
</script>

</body>
</html>
