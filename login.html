<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Lost & Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<!--navbar-->
<header class="site-header">
    <div class="nav-container">

        <a href="index.html" class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
                <h2>Lost & Found</h2>
                <span>Helping you find what matters</span>
            </div>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="lost-items.html">Lost Items</a>
            <a href="found-items.html">Found Items</a>
            <a href="report-item.html">Report Item</a>
            <a href="about.html">About Us</a>
        </nav>

        <a href="login.html" class="login active">
            Login <i class="fa-solid fa-arrow-right"></i>
        </a>

    </div>
</header>

<!--login-->
<main class="page">

    <section class="login-card">

        <div class="login-icon">
            <i class="fa-solid fa-user"></i>
        </div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your Lost & Found account</p>

        <form id="loginForm">

            <div class="field">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="field">
                <div class="password-label">
                    <label>Password</label>
                    <a href="#">Forgot password?</a>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" id="showPassword">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Login <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <p class="signup">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </section>

</main>

<!--footer-->
<footer class="footer">
    <div class="footer-container">

        <div class="footer-brand">
            <div class="footer-icon">
                <i class="fa-solid fa-location-dot"></i>
            </div>

            <div>
                <h3>Lost & Found</h3>
                <p>Helping people find what matters.</p>
            </div>
        </div>

        <p class="copyright">© 2026 Lost & Found. All rights reserved.</p>

    </div>
</footer>

<script src="js/login.js"></script>

</body>
</html>
